name: Test

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install hatch~=1.17.0 pre-commit
      - run: git fetch origin main
      - run: hatch version
      - run: pre-commit run --from-ref origin/main --to-ref HEAD
      - run: hatch check fmt
      - run: hatch check code

  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python:
          - '3.10'
          - '3.11'
          - '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install hatch~=1.17.0
      - run: hatch version
      - run: hatch build
      - run: hatch test --python ${{ matrix.python }}

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install hatch~=1.17.0
      - run: hatch test -py 3.11 --cover
      - uses: codecov/codecov-action@v4.5.0
        with:
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
